name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Security problems go through private vulnerability reporting instead, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start claude in iTerm2
        2. ...
    validations:
      required: true
  - type: input
    id: earshot
    attributes:
      label: Earshot version
      placeholder: 0.1.0 or a commit hash
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.5, MacBook Air M3
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: Terminal.app, iTerm2, tmux inside Ghostty, ...
  - type: textarea
    id: logs
    attributes:
      label: Anything else
      description: Screenshots, the hooks section of your settings.json (remove anything private), Console.app messages from Earshot.
