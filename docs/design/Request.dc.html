<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approval card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#D97757}a:hover{color:#E8957A}
@keyframes es-ring{0%{transform:scale(1);opacity:.9}70%{transform:scale(1.5);opacity:0}100%{transform:scale(1.5);opacity:0}}
.es-ring{animation:es-ring 1.8s ease-out infinite}
.es-wall{background:radial-gradient(60% 80% at 15% 20%, #3B5BDB 0%, transparent 60%),radial-gradient(50% 70% at 85% 30%, #C2255C 0%, transparent 60%),radial-gradient(70% 80% at 60% 100%, #F08C00 0%, transparent 65%),#1A1B2E}
.es-glass{background:rgba(30,30,34,0.52);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%)}
.es-ghost{background:rgba(255,255,255,0.14)}
.es-ghost:hover{background:rgba(255,255,255,0.2)}
.es-primary{background:#FFFFFF}
.es-primary:hover{background:#F2F2F2}
@keyframes es-hop{0%,62%,100%{transform:translateY(0)}70%{transform:translateY(-3px)}80%{transform:translateY(0)}86%{transform:translateY(-1.5px)}92%{transform:translateY(0)}}
.es-hop{animation:es-hop 2.2s ease-in-out infinite}
</style>
</helmet>
<div class="es-wall" style="width: 1200px; height: 820px; position: relative; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #FFFFFF">
<div class="es-glass" style="position: absolute; left: 0; top: 0; width: 1200px; height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; box-sizing: border-box; font-size: 13px; color: rgba(255,255,255,0.92)">
<div style="display: flex; gap: 20px; align-items: center"><span style="font-weight: 600">Terminal</span><span>Shell</span><span>Edit</span><span>View</span><span>Window</span></div>
<div style="display: flex; gap: 16px; align-items: center"><span>Thu Oct 22</span><span>10:41 PM</span></div>
</div>
<div style="position: absolute; left: 466px; top: 0; width: 268px; height: 32px; background: #000000; border-radius: 0 0 11px 11px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; box-sizing: border-box">
<span style="position: relative; width: 20px; height: 20px"><span class="es-ring" style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid #E8957A"></span><span style="position: absolute; inset: 0; border-radius: 50%; background: #1C1C1E; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#E8957A" stroke-width="2.8" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"></line><line x1="18.4" y1="5.6" x2="5.6" y2="18.4"></line></g></svg></span></span>
<span style="display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 7px; border-radius: 9px; background: rgba(10,132,255,0.28); color: #8EC5FF; font-size: 10.5px; font-weight: 600"><span style="width: 5px; height: 5px; border-radius: 3px; background: #0A84FF"></span>Work</span>
</div>
<div class="es-glass" style="position: absolute; left: 380px; top: 40px; width: 440px; border-radius: 26px; box-shadow: 0 0 0 0.5px rgba(255,255,255,0.18), 0 20px 50px rgba(0,0,0,0.35); padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
<div style="background: rgba(255,255,255,0.08); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="position: relative; width: 28px; height: 28px; flex: none">
<span class="es-ring" style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid #E8957A"></span>
<span style="position: absolute; inset: 0; border-radius: 50%; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><g stroke="#E8957A" stroke-width="2.8" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="21"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"></line><line x1="18.4" y1="5.6" x2="5.6" y2="18.4"></line></g></svg></span>
</span>
<span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
<span style="font-size: 13px; font-weight: 600">claude-notch</span>
<span style="font-size: 11.5px; color: rgba(255,255,255,0.6)">Wants to run a command · 2 min</span>
</span>
<span style="display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 11px; background: rgba(10,132,255,0.28); color: #8EC5FF; font-size: 11.5px; font-weight: 600; flex: none"><span style="width: 6px; height: 6px; border-radius: 3px; background: #0A84FF"></span>Work</span>
</div>
<div style="background: rgba(0,0,0,0.32); border-radius: 12px; padding: 9px 11px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; color: rgba(255,255,255,0.5)">Rebuild the app bundle</span>
<span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; line-height: 1.5; color: #FFFFFF; white-space: pre-wrap">rm -rf build &amp;&amp; make app</span>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" class="es-ghost" style="appearance: none; border: 0; margin: 0; font-family: inherit; font-size: inherit; color: inherit; text-align: left; cursor: default; height: 28px; padding: 0 12px; border-radius: 14px; font-size: 12.5px; font-weight: 500; display: flex; align-items: center">Deny</button>
<button type="button" class="es-ghost" style="appearance: none; border: 0; margin: 0; font-family: inherit; font-size: inherit; color: inherit; text-align: left; cursor: default; height: 28px; padding: 0 12px; border-radius: 14px; font-size: 12.5px; font-weight: 500; display: flex; align-items: center">Always</button>
<button type="button" aria-label="Open terminal" class="es-ghost" style="appearance: none; border: 0; margin: 0; font-family: inherit; font-size: inherit; color: inherit; text-align: left; cursor: default; width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5"></path><path d="M12 18h7"></path></g></svg></button>
<span style="flex: 1"></span>
<button type="button" class="es-primary" style="appearance: none; border: 0; margin: 0; font-family: inherit; font-size: inherit; color: inherit; text-align: left; cursor: default; height: 28px; padding: 0 14px; border-radius: 14px; font-size: 12.5px; font-weight: 600; color: #000000; display: flex; align-items: center; gap: 7px">Allow<span style="font-size: 11px; color: rgba(0,0,0,0.42); font-weight: 500">⌘↩</span></button>
</div>
</div>
<div style="display: flex; justify-content: center; height: 22px; align-items: center">
<span style="font-size: 11.5px; color: rgba(255,255,255,0.55)">1 more request · mobile-app</span>
</div>
<sc-for list="{{rows}}" as="s" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px">
<span style="width: 7px; height: 7px; border-radius: 4px; background: {{s.color}}; flex: none"></span>
<span style="font-size: 12.5px; font-weight: 600; white-space: nowrap">{{s.project}}</span>
<span style="font-size: 11.5px; color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1">{{s.phrase}}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":820}}'>
class Component extends DCLogic {
renderVals() {
return {
rows: [
{ project: 'mobile-app', phrase: 'Needs approval · just now', color: '#30D158' },
{ project: 'docs-site', phrase: 'Ready for review · 6 min', color: '#BF5AF2' },
{ project: 'billing-service', phrase: 'Working · 14 min', color: '#0A84FF' }
]
};
}
}
</script>
</body>
</html>
